# https://www.deepseek.com/en/news/v3-2-exp (DeepSeek-V3.2-Exp released 2025-09-29, DSA, live on App/Web/API)
# https://api-docs.deepseek.com/news/news250929/ (same release, HF model + tech report links)
# https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Exp (MIT license, 685B MoE, reasoning + agentic tool-use benchmarks)
# https://aimlapi.com/models/deepseek-v3-2-exp-non-thinking (128K context, 64K max output, text->text, Tools/Structured output features)
