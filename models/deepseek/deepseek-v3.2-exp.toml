name = "DeepSeek V3.2 Exp"
description = "Experimental hybrid-reasoning DeepSeek model with thinking and non-thinking modes, sparse attention, and tool-use"
family = "deepseek"
release_date = "2025-09-29"
last_updated = "2025-09-29"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = true
license = "MIT License"

[limit]
context = 128_000
output = 64_000

[modalities]
input = ["text"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Exp"
