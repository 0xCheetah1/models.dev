# Sources: https://aimlapi.com/models/grok-4-6 (AIMLAPI pricing for x-ai/grok-4-6: $2.6/$7.8/$0.65 per 1M up to 200K, $5.2/$15.6/$1.3 above 200K; 500K context)
# https://docs.aimlapi.com/api-references/text-models-llm/xai/grok-4-6 (x-ai/grok-4-6 on AIMLAPI chat completions; reasoning effort + 500K context)
# Lab baseline: https://docs.x.ai/developers/models/grok-4.6 and https://docs.x.ai/developers/pricing (effort low/medium/high/xhigh; 200K long-context threshold)
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2.6
output = 7.8
cache_read = 0.65

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 5.2
output = 15.6
cache_read = 1.3
