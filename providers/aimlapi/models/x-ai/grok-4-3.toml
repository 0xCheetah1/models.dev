# https://docs.x.ai/developers/models/grok-4.3 — lab grok-4.3: 1M context, reasoning none|low|medium|high|xhigh, input $1.25 / output $2.50
base_model = "xai/grok-4.3"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.625
output = 3.25
cache_read = 0.26

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 3.25
output = 6.5
cache_read = 0.52
